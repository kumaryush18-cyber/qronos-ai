name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        # Secrets are passed as environment variables, never written into this
        # file or into the workflow log: ssh-action masks them.
        env:
          GRAVITY_API_KEY: ${{ secrets.GRAVITY_API_KEY }}
          ROUTER_INITIAL_PASSWORD: ${{ secrets.ROUTER_INITIAL_PASSWORD }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          envs: GRAVITY_API_KEY,ROUTER_INITIAL_PASSWORD,GHCR_PAT,DISCORD_BOT_TOKEN,DATABASE_URL
          script: |
            set -e
            echo "🚀 Updating Qronos AI on Azure VM..."
            cd /opt/qronos
            # Upsert one KEY=value line without ever printing the value.
            upsert() {
              key="$1"
              # A secret that arrives with a trailing CR/LF would write a broken
              # line into .env (the value then contains a newline). Strip it.
              value=$(printf '%s' "$2" | tr -d '\r\n')
              if [ -z "$value" ]; then
                echo "::warning::$key is empty in GitHub secrets; keeping the value already on the VM"
                return 0
              fi
              touch .env
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            upsert GRAVITY_API_KEY "$GRAVITY_API_KEY"
            upsert ROUTER_INITIAL_PASSWORD "$ROUTER_INITIAL_PASSWORD"
            # The Discord bot token lives only here: GitHub secret -> .env on the
            # VM -> the container. The image never carries it.
            upsert DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN"
            # The database URL is a secret: GitHub secret -> .env on the VM ->
            # the container. A new cluster can be switched in one deploy.
            upsert DATABASE_URL "$DATABASE_URL"
            # Proof that the value landed, without ever printing the password:
            # only the host and the database name are shown.
            if grep -q '^DATABASE_URL=' .env; then
              echo "db target: $(grep '^DATABASE_URL=' .env | sed -E 's|^DATABASE_URL=[^@]*@||; s|\?.*$||')"
            fi
            echo "$GHCR_PAT" | docker login ghcr.io -u kumaryush18-cyber --password-stdin
            docker compose pull
            # Additive schema for the admin client tabs. The script skips anything
            # that already exists, so a repeated deploy is harmless. It must run
            # against the freshly pulled image, before the app starts.
            if docker compose run --rm --no-deps app node scripts/ensure-client-telemetry.mjs; then
              echo "✅ client telemetry schema ready"
            else
              echo "::warning::client telemetry schema was not applied; the client tabs stay empty until it is"
            fi
            # Additive schema for the free-pi token pool in the admin panel.
            # Same rule: skip what exists, never alter or drop anything.
            if docker compose run --rm --no-deps app node scripts/ensure-freepi-slots.mjs; then
              echo "✅ free-pi credential table ready"
            else
              echo "::warning::free-pi credential table was not applied; the free-pi admin tab stays empty until it is"
            fi
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "✅ Deployment completed successfully!"
