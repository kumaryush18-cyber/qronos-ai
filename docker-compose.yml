services:
  app:
    image: ghcr.io/kumaryush18-cyber/qronos-ai:latest
    container_name: qronos-gateway
    restart: always
    env_file: .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/api/health\").then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - qronos-net

  router:
    image: ghcr.io/kumaryush18-cyber/qronos-router:latest
    container_name: qronos-router
    restart: always
    environment:
      - PORT=10000
      # Comes from the GitHub secret ROUTER_INITIAL_PASSWORD, written into .env
      # by the deploy workflow. Compose refuses to start when it is missing, so
      # the default "changeme123" can never reach a live host again.
      - INITIAL_PASSWORD=${ROUTER_INITIAL_PASSWORD:***REMOVED*** ROUTER_INITIAL_PASSWORD in .env}
      - DATA_DIR=/data
    volumes:
      - router_data:/data
    ports:
      - "10000:10000"
    networks:
      - qronos-net

  caddy:
    image: caddy:2-alpine
    container_name: qronos-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - qronos-net
    depends_on:
      - app
      - router

networks:
  qronos-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  router_data:
