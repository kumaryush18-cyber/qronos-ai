services:
  qronos:
    image: ghcr.io/kumaryush18-cyber/qronos-ai:latest
    container_name: qronos-ai
    restart: unless-stopped
    ports:
      - "80:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    deploy:
      resources:
        limits:
          memory: 800M
